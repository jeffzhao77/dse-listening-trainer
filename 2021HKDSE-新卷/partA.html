<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1f2a37;--mut:#6b7280;--line:#e3e8ef;--brand:#2563eb;--brand-d:#1d4ed8;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--accent:#7c3aed}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:.2s;pointer-events:none}

  input[type=text],textarea{font-size:15px;min-height:40px;border-radius:10px;border-color:#bdcbc4;background:#fbfdfc}

  .mc{font-size:14px;padding:10px 13px;border-radius:11px;background:#fbfdfc;transition:.12s}.mc:hover{border-color:#8eb9a8;background:#f0f8f4}.mc:has(input:checked){border-color:var(--brand);background:#eaf5f0;box-shadow:inset 3px 0 var(--brand)}
  input[type=radio],input[type=checkbox]{accent-color:var(--brand);width:17px;height:17px}

  .btn{min-height:42px;border-radius:11px;padding:9px 17px;font-size:14px}.btn.secondary{background:#edf3f0;color:#33483f}.btn.secondary:hover{background:#e1ebe6}

<body>
<header>
  <div class="header-inner"><div><h1 id="hTitle">DSE Paper 3 Part A</h1>
  <div class="sub">先完成真题，再把每一道错题听懂</div></div><div class="year-chip">Part A · 42 marks</div></div>
</header>
<div class="wrap">
  <div class="steps" id="steps">
    <div class="step active" data-mode="study"><span class="n">1</span><span class="t">整篇精听 + 作答</span><div class="d">听录音，完成全部题目</div></div>
    <div class="step" data-mode="mark"><span class="n">2</span><span class="t">查看结果</span><div class="d">对照原文逐题判分</div></div>
    <div class="step" data-mode="dictation"><span class="n">3</span><span class="t">错题精听</span><div class="d">重听信号/答案句，逐字听写</div></div>
    <div class="step" data-mode="answers"><span class="n">4</span><span class="t">总结复盘</span><div class="d">参考答案 + 全文 tapescript</div></div>
    <div class="step teacher-step" data-mode="calibrate"><span class="n">⚙</span><span class="t">老师校准</span><div class="d">微调时间戳并导出</div></div>
  </div>
  <div class="audiobar" id="audiobar">
    <div class="arow" style="margin-bottom:8px"><span class="pill" id="modePill">Step 1</span><span class="muted" id="audioStatus"></span></div>
    <audio id="audio" controls preload="metadata"></audio>
  </div>
  <div id="calbar" class="calbar hide"></div>
  <div id="content"></div>
</div>
<div class="toast" id="toast"></div>
<script src="data/mt56_partA.js"></script>
<script>
const qs=new URLSearchParams(location.search);
const DATA_URL=qs.get('data')||'data/mt56_partA.json';
if(qs.get('teacher')==='1')document.body.classList.add('teacher-mode');
let DATA=null,MODE='study';
const A={},T={};let RESULTS=null;
let STUDY_TASK=1;
const audio=document.getElementById('audio');
const content=document.getElementById('content');
let CAL={sel:null};
window._dictDone={};window._dictTargets={};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function fmt(s){if(s==null)return'--:--';const m=Math.floor(s/60),x=(s%60);return m+':'+x.toFixed(1).padStart(4,'0');}
function esc(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function audioFor(task){return task.audio||DATA.audio;}

// ---- marking helpers ----
function norm(s){return (s||'').toLowerCase().replace(/[‘’']/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();}
function wordsOf(s){return norm(s).split(' ').filter(Boolean);}
function variantMatch(student,variant){
  const sn=' '+norm(student)+' ';
  const alts=variant.split('//').flatMap(p=>p.split('/'));
  for(const alt of alts){const ws=wordsOf(alt.replace(/\([^)]*\)/g,' '));if(!ws.length)continue;if(ws.every(w=>sn.includes(' '+w+' ')))return true;}
  return false;
}
function markFill(no,answers){const v=A[no]||'';if(!v.trim())return{ok:false,empty:true};return{ok:answers.some(x=>variantMatch(v,x)),empty:false};}
function setEq(a,b){if(a.size!==b.length)return false;return b.every(x=>a.has(x));}

// ---- collect all gradable questions ----
function allQuestions(){
  const out=[];
  for(const task of DATA.tasks){
    const walk=(b)=>{
      if(b&&typeof b==='object'){
        if('no'in b && b.ts){ out.push({...b,task:task.id, kind:b.kind||inferKind(b), labelText:b.label||((b.prefix||'')+' (#'+b.no+')')||('#'+b.no)});}
        for(const k in b) if(k!=='task') walk(b[k]);
      } else if(Array.isArray(b)){ for(const x of b) walk(x); }
    };
    for(const blk of task.blocks){
      if(blk.type==='mc'||blk.type==='map'||blk.type==='tick'||blk.type==='fill'){out.push({...blk,task:task.id,kind:blk.type,labelText:blk.label});}
      else if(blk.type==='steporder'){for(const it of blk.items)out.push({...it,task:task.id,kind:'num',labelText:'步骤图 (#'+it.no+')'});}
      else if(blk.type==='maplabel'){for(const it of blk.items)out.push({...it,task:task.id,kind:'letter',labelText:it.place+' (#'+it.no+')'});}
      else if(blk.type==='table'){
        for(const row of blk.rows)for(const cell of row){
          if(cell.fill)out.push({...cell.fill,task:task.id,kind:'fill',labelText:(cell.fill.prefix||'')+' (#'+cell.fill.no+')'});
          if(cell.fillgroup)for(const f of cell.fillgroup)out.push({...f,task:task.id,kind:'fill',labelText:(f.prefix||'')+' (#'+f.no+')'});
        }
      }
    }
  }
  out.sort((a,b)=>a.no-b.no);
  return out;
}
function inferKind(b){return 'fill';}
function questionAnswered(q){
  if(q.kind==='fill'||q.kind==='num')return !!(A[q.no]||'').trim();
  if(q.kind==='tick')return T[q.no]instanceof Set&&T[q.no].size>0;
  return !!T[q.no];
}
function answeredCount(){return allQuestions().filter(questionAnswered).length;}
function setTaskSpeed(rate,btn){
  const player=document.querySelector('.taskaudio');if(!player)return;
  player.playbackRate=rate;
  document.querySelectorAll('.speed-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
}
function switchTask(id){STUDY_TASK=id;renderStudy();window.scrollTo({top:0,behavior:'smooth'});}

// ---- STUDY render ----
function inputFill(f){const v=A[f.no]||'';if(f.textarea||f.open)return `<textarea oninput="A[${f.no}]=this.value">${esc(v)}</textarea>`;const pre=f.prefix?`<span class="pre">${f.prefix} </span>`:'';return `${pre}<input type="text" value="${esc(v).replace(/"/g,'&quot;')}" oninput="A[${f.no}]=this.value">`;}
function blockStudy(b){
  const t=b.type;
  if(t==='text')return `<div class="textline">${b.html}</div>`;
  if(t==='heading')return `<div class="heading${b.sub?' sub':''}">${b.text}</div>`;
  if(t==='fill')return `<div class="qrow"><span class="qno">${b.no}</span><span class="qlabel">${b.label||''}</span><span style="flex:2 1 260px">${inputFill(b)}</span></div>`;
  if(t==='mc'||t==='map'){
    let r='';
    if(t==='map'&&b.image)r+=`<div><img src="${b.image}" style="max-width:100%;border:1px solid var(--line);border-radius:8px"></div>`;
    r+=`<div class="qrow"><span class="qno">${b.no}</span><span class="qlabel">${b.label}</span></div><div class="ticks">`;
    const opts=t==='map'?b.options.map(o=>({id:o,text:o})):b.options;
    r+=opts.map(o=>`<label class="mc"><input type="radio" name="q${b.no}" ${T[b.no]===o.id?'checked':''} onclick="T[${b.no}]='${o.id}'"> ${t==='mc'?('<b>'+o.id+'.</b> '):''}${o.text}</label>`).join('');
    return r+'</div>';
  }
  if(t==='tick'){
    if(!(T[b.no]instanceof Set))T[b.no]=new Set();
    let r=`<div class="qrow"><span class="qno">${b.no}</span><span class="qlabel">${b.label}</span></div><div class="ticks">`;
    r+=b.options.map(o=>`<label class="mc"><input type="checkbox" ${T[b.no].has(o.id)?'checked':''} onclick="toggleTick(${b.no},'${o.id}',${b.pick})"> ${o.text}</label>`).join('');
    return r+`</div><div class="hint">请勾选 ${b.pick} 项</div>`;
  }
  if(t==='steporder'){
    let r=`<div class="hint">${b.label||''}</div><div class="imggrid">`;
    r+=b.items.map(it=>`<div class="imgcell"><img src="${it.img}"><div class="cap">第 (${it.no}) 张</div><input type="text" maxlength="1" value="${esc(A[it.no]||'')}" oninput="A[${it.no}]=this.value" placeholder="?"></div>`).join('');
    return r+'</div>';
  }
  if(t==='maplabel'){
    let r=`<div class="imggrid">`;
    r+=b.items.map(it=>`<div class="imgcell"><img src="${it.img}"><div class="cap"><b>${it.place}</b> (${it.no})</div><div class="letterrow">`+
      it.options.map(o=>`<label><input type="radio" name="q${it.no}" ${T[it.no]===o?'checked':''} onclick="T[${it.no}]='${o}'"> ${o}</label>`).join('')+`</div></div>`).join('');
    return r+'</div>';
  }
  if(t==='table'){
    let r=b.title?`<div class="heading sub">${b.title}</div>`:'';
    r+=`<table class="q"><thead><tr>`+b.headers.map(h=>`<th>${h||''}</th>`).join('')+`</tr></thead><tbody>`;
    for(const row of b.rows){r+='<tr>';for(const c of row){
      if(c.static!==undefined)r+=`<td><b>${c.static}</b></td>`;
      else if(c.fill)r+=`<td><span class="qno">${c.fill.no}</span> ${inputFill(c.fill)}</td>`;
      else if(c.fillgroup)r+=`<td>`+c.fillgroup.map(f=>`<div style="margin:5px 0">${f.prefix?esc(f.prefix)+' ':''}<span class="qno">${f.no}</span> ${inputFill(f)}</div>`).join('')+`</td>`;
      else r+='<td></td>';
    }r+='</tr>';}
    return r+'</tbody></table>';
  }
  return '';
}
function toggleTick(no,id,pick){if(!(T[no]instanceof Set))T[no]=new Set();const s=T[no];if(s.has(id))s.delete(id);else{if(s.size>=pick){toast('最多选 '+pick+' 项');event.target.checked=false;return;}s.add(id);}}
function renderStudy(){
  const total=allQuestions().length,done=answeredCount(),pct=Math.round(done/total*100);
  const task=DATA.tasks.find(t=>t.id===STUDY_TASK)||DATA.tasks[0];STUDY_TASK=task.id;
  let h=`<div class="card intro-card"><div class="eyebrow">Listening situation</div><div class="situation">${DATA.situation}</div></div>`;
  h+=`<div class="task-switcher">${DATA.tasks.map(t=>`<button class="task-tab ${t.id===task.id?'active':''}" onclick="switchTask(${t.id})"><span class="k">TASK ${t.id} · ${t.marks} MARKS</span><b>${t.title}</b></button>`).join('')}</div>`;
  h+=`<div class="card"><div class="study-top"><div><div class="eyebrow">Task ${task.id} of ${DATA.tasks.length}</div><div class="tasktitle">${task.title}</div><div class="taskinstr">${task.instructions}</div></div><div class="progress-copy">已完成 ${done} / ${total}<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div></div>`;
  if(DATA.perTaskAudio)h+=`<div class="taskaudio-wrap"><audio class="taskaudio" controls preload="metadata" src="${audioFor(task)}"></audio><div class="audio-tools"><span class="hint">建议先看题，再从头播放这一段录音</span><div class="speed-btns"><button class="speed-btn" onclick="setTaskSpeed(.75,this)">0.75×</button><button class="speed-btn active" onclick="setTaskSpeed(1,this)">1×</button><button class="speed-btn" onclick="setTaskSpeed(1.25,this)">1.25×</button></div></div></div>`;
  h+=task.blocks.map(blockStudy).join('');
  const prev=task.id>1?`<button class="btn secondary" onclick="switchTask(${task.id-1})">← 上一部分</button>`:`<button class="btn secondary" onclick="if(confirm('确定清空全部作答？')){for(const k in A)delete A[k];for(const k in T)delete T[k];renderStudy();}">重新开始</button>`;
  const next=task.id<DATA.tasks.length?`<button class="btn" onclick="switchTask(${task.id+1})">下一部分 →</button>`:`<button class="btn" onclick="go('mark')">提交整卷并查看结果 →</button>`;
  h+=`<div class="study-actions">${prev}${next}</div></div>`;
  content.innerHTML=h;
}
// ---- MARK ----
function gradeQuestion(q){
  if(q.kind==='fill'){const r=markFill(q.no,q.answer);return{ok:r.ok,empty:r.empty,student:A[q.no]||'',key:q.answer.join('  /  ')};}
  if(q.kind==='num'){const v=(A[q.no]||'').trim();return{ok:v===String(q.answer),empty:!v,student:v||'(空)',key:'顺序 '+q.answer};}
  if(q.kind==='letter'||q.kind==='mc'||q.kind==='map'){const sel=T[q.no];return{ok:sel===q.answer,empty:!sel,student:sel||'(未选)',key:q.answer};}
  if(q.kind==='tick'){const s=T[q.no]instanceof Set?T[q.no]:new Set();return{ok:setEq(s,q.answer),empty:s.size===0,student:[...s].join(', ')||'(未选)',key:q.answer.join(', ')};}
}
function renderMark(){
  const qlist=allQuestions();let correct=0;RESULTS={};let rows='';let cur=0;
  for(const q of qlist){const g=gradeQuestion(q);RESULTS[q.no]=g;if(g.ok)correct++;
    if(q.task!==cur){cur=q.task;rows+=`<div class="heading">Task ${cur}</div>`;}
    rows+=`<div class="markitem ${g.ok?'ok':'bad'}"><div><span class="qno">${q.no}</span> <span class="res ${g.ok?'ok':'bad'}">${g.ok?'✓ 正确':(g.empty?'— 未作答':'✗ 错误')}</span></div>
      <div class="sa" style="margin-top:5px">你的答案：<b>${esc(g.student)||'(空)'}</b></div>${g.ok?'':`<div class="hint" style="margin-top:5px">先不公布答案；下一步只重听这一题的关键句。</div>`}</div>`;}
  const wrong=qlist.length-correct;
  content.innerHTML=`<div class="card"><div class="eyebrow">Your result</div><div class="scorebox"><div><div class="muted">本次得分</div><div class="big">${correct} / ${qlist.length}</div></div>
    <div><b>${wrong?`还有 ${wrong} 题值得再听一次`:'全部答对了，做得很好'}</b><div class="hint" style="margin-top:4px">系统已经把错题整理好，不需要重听整段录音。</div></div></div>
    <div class="actions"><button class="btn" onclick="go('dictation')">开始错题精听 →</button><button class="btn ghost" onclick="go('study')">← 返回检查</button></div></div>
    <div class="card">${rows}</div>`;
}
// ---- DICTATION ----
let LOOP=null,LOOP_PLAYS=0;
function curTaskOf(no){return DATA.tasks.find(t=>allQ4Task(t).includes(no));}
function allQ4Task(task){const ns=[];const walk=b=>{if(b&&typeof b==='object'){if('no'in b&&b.ts)ns.push(b.no);for(const k in b)walk(b[k]);}else if(Array.isArray(b))b.forEach(walk);};walk(task.blocks);return ns;}
function playSlice(task,seg,loop){
  clearLoop();
  const src=audioFor(task);
  if(!audio.src.endsWith(src)){audio.src=src;}
  const start=seg&&seg[0],end=seg&&seg[1];
  if(start==null){audio.play();toast('该题暂无时间戳，播放整段');return;}
  LOOP_PLAYS=0;
  const begin=()=>{audio.currentTime=Math.max(0,start-0.15);audio.play();};
  if(audio.readyState<1){audio.addEventListener('loadedmetadata',begin,{once:true});audio.load();}else begin();
  const stop=end==null?start+8:end+0.15;
  LOOP=setInterval(()=>{if(audio.currentTime>=stop){
    LOOP_PLAYS++;
    if(loop&&LOOP_PLAYS<3){audio.currentTime=Math.max(0,start-0.15);audio.play();}
    else{audio.pause();clearLoop();if(loop)toast('答案句已播放 3 遍');}
  }},60);
}
function clearLoop(){if(LOOP){clearInterval(LOOP);LOOP=null;}LOOP_PLAYS=0;}
function dictKey(s){return s.toLowerCase().replace(/\s+/g,' ').trim();}
function renderDiff(target,val){let i=0;const n=Math.min(target.length,val.length);while(i<n&&target[i].toLowerCase()===val[i].toLowerCase())i++;let h='<span class="good">'+esc(val.slice(0,i))+'</span>';if(i<val.length)h+='<span class="bad">'+esc(val.slice(i))+'</span>';return h;}
function maskTarget(t){return esc(t).replace(/[A-Za-z0-9’']/g,'_');}
function renderDictation(){
  const qlist=allQuestions();
  const list=qlist.filter(q=>window._dictAll?true:(RESULTS?!RESULTS[q.no].ok:true));
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><div><b>切片挖空逐字精听</b><div class="hint">看题干 → 点播放，逐字敲出你听到的原句（不给任何提示词）→ 与原文完全一致后才显示答案。</div></div>
    <label class="hint"><input type="checkbox" ${window._dictAll?'checked':''} onclick="window._dictAll=this.checked;render()"> 显示全部题目</label></div></div>`;
  if(!RESULTS&&!window._dictAll){content.innerHTML=`<div class="card">请先完成 <b>Step 2 批改</b>，系统会自动挑出错题进入精听。<div class="actions"><button class="btn" onclick="go('mark')">去批改</button> <button class="btn ghost" onclick="window._dictAll=true;render()">或练全部题目</button></div></div>`;return;}
  if(list.length===0){content.innerHTML=h+`<div class="card" style="text-align:center">🎉 没有需要精听的题了！<div class="actions" style="justify-content:center"><button class="btn" onclick="go('answers')">查看答案 →</button></div></div>`;return;}
  let cur=0;window._dictTargets={};window._dictAnsKey={};
  for(const q of list){window._dictTargets[q.no]=q.cloze||'';const task=DATA.tasks.find(t=>t.id===q.task);
    window._dictAnsKey[q.no]=(q.kind==='num')?('正确顺序：'+q.answer):(q.kind==='letter'||q.kind==='mc'||q.kind==='map')?('正确选项：'+q.answer):(q.kind==='tick')?('正确：'+(q.answer||[]).join(' , ')):((q.answer||[]).join('  //  '));
    if(q.task!==cur){cur=q.task;h+=`<div class="heading">Task ${cur}</div>`;}
    const target=q.cloze||'';const done=window._dictDone[q.no];
    h+=`<div class="dict ${done?'done':''}" id="dict${q.no}">
      <div class="row" style="justify-content:space-between"><h4><span class="qno">${q.no}</span> 题干：${esc(q.labelText||'')}</h4><span class="badge ${done?'ok':'todo'}">${done?'✓ 已通过':'待听写'}</span></div>
      <div class="row">
        <button class="btn sm" onclick='playSlice(DATA.tasks[${q.task-1}],${JSON.stringify(q.ts.answer)},true)'>▶ 答案句 ×3</button>
        <button class="btn sm ghost" onclick='playSlice(DATA.tasks[${q.task-1}],${JSON.stringify(q.ts.signal)},false)'>▶ 听信号句（提示）</button>
        <button class="btn sm gray" onclick="audio.pause();clearLoop()">⏸ 停</button></div>
      <div class="dictsignal">⌨ 听录音，逐字打出你听到的整句（不显示任何提示词）</div>
      <div class="dicttarget" id="tgt${q.no}">${done?esc(target):maskTarget(target)}</div>
      <input class="dictinput" id="din${q.no}" placeholder="逐字敲出你听到的整句…" oninput="onDict(${q.no})" value="${done?esc(target).replace(/"/g,'&quot;'):''}" ${done?'disabled':''}>
      <div class="diff" id="diff${q.no}"></div>
      <div id="ans${q.no}" class="${done?'':'hide'}" style="margin-top:8px;font-size:12.5px"><span class="res ok">✓ 原句</span> ${esc(target)}<br><span class="badge ok">参考答案</span> ${esc(window._dictAnsKey[q.no])}</div></div>`;
  }
  content.innerHTML=h;
}
function onDict(no){const target=window._dictTargets[no];const inp=document.getElementById('din'+no);const val=inp.value;document.getElementById('diff'+no).innerHTML=renderDiff(target,val);
  if(dictKey(val)===dictKey(target)){window._dictDone[no]=true;document.getElementById('dict'+no).classList.add('done');document.getElementById('tgt'+no).innerHTML=esc(target);document.getElementById('ans'+no).classList.remove('hide');inp.disabled=true;toast('✓ 第 '+no+' 题听写正确！');}}
// ---- ANSWERS ----
function renderAnswers(){
  const qlist=allQuestions();let h=`<div class="card"><b>参考答案</b> <span class="hint">（// 不同说法；( ) 可选；/ 可替换）</span></div>`;let cur=0,rows='';
  for(const q of qlist){if(q.task!==cur){cur=q.task;if(rows){h+=`<div class="card"><table class="anskey"><tbody>${rows}</tbody></table></div>`;rows='';}h+=`<div class="heading">Task ${q.task} — ${DATA.tasks[q.task-1].title}</div>`;}
    let key;if(q.kind==='fill')key=q.answer.join('  //  ');else if(q.kind==='tick')key=q.answer.join(' , ');else if(q.kind==='num')key='顺序 '+q.answer;else key=q.answer;
    rows+=`<tr><td style="width:34px"><span class="qno">${q.no}</span></td><td>${esc(key+'')}</td></tr>`;}
  if(rows)h+=`<div class="card"><table class="anskey"><tbody>${rows}</tbody></table></div>`;
  h+=`<div class="card"><b>全文 Tapescript</b>`;
  for(const task of DATA.tasks){h+=`<details class="ts" ${task.id===1?'open':''}><summary>Task ${task.id} — ${task.title}</summary>`+task.tapescript.map(l=>`<div class="tline"><b>${DATA.speakers[l.sp]||l.sp}:</b> ${esc(l.t)}</div>`).join('')+`</details>`;}
  content.innerHTML=h+`</div>`;
}
// ---- CALIBRATION ----
function renderCalibrate(){
  document.getElementById('calbar').classList.remove('hide');
  const qlist=allQuestions();const sel=CAL.sel||qlist[0].no;CAL.sel=sel;const q=qlist.find(x=>x.no===sel);const task=DATA.tasks[q.task-1];
  document.getElementById('calbar').innerHTML=`
    <div class="row" style="justify-content:space-between"><div>当前 <span class="now" id="calnow">0:00.0</span>
      <button class="btn sm" onclick="audio.paused?audio.play():audio.pause()">▶/⏸</button>
      <button class="btn sm gray" onclick="audio.currentTime=Math.max(0,audio.currentTime-2)">−2s</button>
      <button class="btn sm gray" onclick="audio.currentTime+=2">+2s</button></div>
      <div class="muted">标注：<b>第 ${sel} 题</b>（Task ${q.task}）</div></div>
    <div class="row" style="margin-top:8px"><span class="badge todo">信号句</span>
      <button class="btn sm" onclick="setTs('signal',0)">起 ${fmt(q.ts.signal[0])}</button>
      <button class="btn sm" onclick="setTs('signal',1)">止 ${fmt(q.ts.signal[1])}</button>
      <button class="btn sm ghost" onclick='playSlice(DATA.tasks[${q.task-1}],${JSON.stringify(q.ts.signal)},false)'>试听</button>
      <span style="width:14px"></span><span class="badge ok">答案句</span>
      <button class="btn sm" onclick="setTs('answer',0)">起 ${fmt(q.ts.answer[0])}</button>
      <button class="btn sm" onclick="setTs('answer',1)">止 ${fmt(q.ts.answer[1])}</button>
      <button class="btn sm ghost" onclick='playSlice(DATA.tasks[${q.task-1}],${JSON.stringify(q.ts.answer)},true)'>试听(循环)</button>
      <button class="btn sm gray" onclick="audio.pause();clearLoop()">停</button></div>
    <div class="muted mono" style="margin-top:8px">🔎 ${esc(q.signal||'')}</div>
    <div class="muted mono">🎯 ${esc(q.cloze||'')}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm" onclick="exportJSON()">⬇ 导出 JSON</button><span class="muted">时间戳已由 AI 自动对齐，此处仅供微调</span></div>`;
  let cards='';let cur=0;
  for(const x of qlist){if(x.task!==cur){cur=x.task;cards+=`<div class="heading">Task ${cur}</div>`;}
    const set=x.ts.answer[0]!=null;
    cards+=`<div class="calq ${x.no===sel?'sel':''} ${set?'set':''}" onclick="CAL.sel=${x.no};render()"><div class="t">#${x.no} ${set?'✓':''}</div><div class="v">ans ${fmt(x.ts.answer[0])}–${fmt(x.ts.answer[1])}</div></div>`;}
  content.innerHTML=`<div class="card">${cards}</div>`;
  if(!audio.src.endsWith(audioFor(task)))audio.src=audioFor(task);
}
function setTs(target,idx){const q=allQuestions().find(x=>x.no===CAL.sel);const t=Math.round(audio.currentTime*100)/100;setTsInData(q.no,target,idx,t);toast(`#${q.no} ${target} ${idx?'止':'起'} = ${fmt(t)}`);renderCalibrate();}
function setTsInData(no,target,idx,val){for(const task of DATA.tasks){const walk=b=>{if(b&&typeof b==='object'){if(b.no===no&&b.ts)b.ts[target][idx]=val;for(const k in b)walk(b[k]);}else if(Array.isArray(b))b.forEach(walk);};walk(task.blocks);}}
function exportJSON(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(DATA.id||'partA')+'.json';a.click();}
audio.addEventListener('timeupdate',()=>{const n=document.getElementById('calnow');if(n)n.textContent=fmt(audio.currentTime);});
// ---- router ----
function go(m){MODE=m;document.querySelectorAll('.step').forEach(s=>s.classList.toggle('active',s.dataset.mode===m));window.scrollTo(0,0);render();}
function render(){
  const pills={study:'Step 1 · 整篇精听',mark:'Step 2 · AI 严格批改',dictation:'Step 3 · 切片挖空精听',answers:'Step 4 · 显示答案',calibrate:'⚙ 音频校准'};
  document.getElementById('modePill').textContent=pills[MODE];
  // hide global audio bar in study mode when per-task audio is used
  document.getElementById('audiobar').style.display=(MODE==='study'&&DATA.perTaskAudio)?'none':'block';
  if(MODE!=='calibrate')document.getElementById('calbar').classList.add('hide');
  if(MODE==='study')renderStudy();else if(MODE==='mark')renderMark();else if(MODE==='dictation')renderDictation();else if(MODE==='answers')renderAnswers();else renderCalibrate();
}
document.querySelectorAll('.step').forEach(s=>s.addEventListener('click',()=>go(s.dataset.mode)));
function loadPartAData(){
  return fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).catch(e=>{
    if(DATA_URL==='data/mt56_partA.json'&&window.MT56_PARTA_DATA)return window.MT56_PARTA_DATA;
    throw e;
  });
}
loadPartAData().then(d=>{
  DATA=d;document.getElementById('hTitle').textContent='DSE Paper 3 Part A — '+(d.title||'');
  if(!d.perTaskAudio&&d.audio)audio.src=d.audio;
  document.getElementById('audioStatus').textContent=d.title||'';
  render();
}).catch(e=>{content.innerHTML=`<div class="card" style="border-color:#fca5a5"><b style="color:#b91c1c">无法加载数据（${e.message}）</b><div class="hint" style="margin-top:6px">当前题目没有直开备用数据。请运行 <code>python3 -m http.server 8011</code> 后访问 <code>http://localhost:8011/partA.html?data=${DATA_URL}</code></div></div>`;});
</script>
